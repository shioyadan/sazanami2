name: Deploy Sazanami2 Web

on:
  push:
    branches: [master, stable]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Pagesはサイト全体を置換するため、常に両branchを同じartifactへまとめる。
      - name: Checkout development branch
        uses: actions/checkout@v6
        with:
          ref: master
          path: development

      - name: Checkout stable branch
        uses: actions/checkout@v6
        with:
          ref: stable
          path: stable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: |
            development/package-lock.json
            stable/package-lock.json

      - name: Install development dependencies
        working-directory: development
        run: npm ci

      - name: Verify and package latest app
        working-directory: development
        run: make latest-archive

      - name: Install stable dependencies
        working-directory: stable
        run: npm ci

      - name: Verify and build stable app
        working-directory: stable
        run: |
          ./node_modules/.bin/tsc --noEmit
          make production
          python3 ../development/test/single_html_smoke.py dist/index.html

      - name: Assemble GitHub Pages site
        run: |
          mkdir -p dist-site/stable
          cp development/dist/index.html dist-site/index.html
          cp development/dist-release/sazanami2-latest.zip dist-site/sazanami2-latest.zip
          cp development/docs/sample.csv dist-site/sample.csv
          cp stable/dist/index.html dist-site/stable/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-site

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
